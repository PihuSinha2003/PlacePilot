{% extends 'base.html' %}

{% block title %}{{ title }} — PlacePilot{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <h3 class="mb-4">{{ title }}</h3>
                    <form method="post">
                        {% csrf_token %}
                        {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label">{{ field.label }}</label>
                            {{ field }}
                            {% if field.errors %}
                            <div class="text-danger small">{{ field.errors.0 }}</div>
                            {% endif %}
                        </div>
                        {% endfor %}
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">Save</button>
                            <a href="{% url 'jobs:admin_jobs' %}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.querySelectorAll('form input:not([type=checkbox]), form select, form textarea').forEach(el => {
    if (el.type === 'checkbox') {
        el.classList.add('form-check-input');
    } else if (el.tagName === 'SELECT') {
        el.classList.add('form-select');
    } else {
        el.classList.add('form-control');
    }
});
</script>
{% endblock %}
